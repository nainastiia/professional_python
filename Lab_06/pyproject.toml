[project]
name = "warehouse-system"
version = "0.1.0"
description = "Система обліку складських запасів"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "integration: integration tests",
]

[tool.coverage.run]
branch = true
source = ["application"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80