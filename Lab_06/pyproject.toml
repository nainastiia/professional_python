
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warehouse-lab6"
version = "1.0.0"
description = "Warehouse stock management and pytest testing"
requires-python = ">=3.10"
dependencies = []


[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "integration: integration tests for warehouse operations",
]

[tool.coverage.run]
branch = true
source = ["src/warehouse"]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
