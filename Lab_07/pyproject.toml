[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "warehouse-system"
version = "0.7.0"
description = "Warehouse inventory management application with database persistence"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
warehouse-system = "warehouse_system.main:main"